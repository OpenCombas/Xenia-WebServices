<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Xenia Web Services</title>

        <link rel="shortcut icon" type="image/png" href="assets/favicon.png" />
        <link rel="shortcut icon" type="image/svg+xml" sizes="any" href="assets/favicon.svg" />
        <link rel="apple-touch-icon" type="image/png" href="assets/favicon.png" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Server Status" />
        <meta name="theme-color" content="#111212" />

        <!-- OG Meta Tags -->
        <meta property="og:url" content="https://xenia-netplay-2a0298c0e3f4.herokuapp.com/" />
        <meta property="og:type" content="website" />
        <meta property="og:title" content="Xenia Web Services" />
        <meta property="og:description" content="Server Status" />
        <meta property="og:image" content="https://xenia-netplay-2a0298c0e3f4.herokuapp.com/assets/favicon.png" />

        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="css/skeleton-loader.css">

        <style>
          #title_update {
            display: none;
          }
        </style>

        <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
        <script src="js/code.js"></script>
    </head>
    <body>
      <div style="text-align: center;">
        <h1>Xenia Web Services</h1>

        <!-- ChromeHounds Neroimus War: online / total players by nation (data from /chapi/api/players-by-nation) -->
        <div id="nation_stats">
          <table class="nation-table">
            <thead>
              <tr>
                <th class="nation-A">Tarakia</th>
                <th class="nation-B">Morskoj</th>
                <th class="nation-C">Sal Kar</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td class="nation-A"><span class="online" id="nation-A-online">&ndash;</span> / <span class="total" id="nation-A-total">&ndash;</span></td>
                <td class="nation-B"><span class="online" id="nation-B-online">&ndash;</span> / <span class="total" id="nation-B-total">&ndash;</span></td>
                <td class="nation-C"><span class="online" id="nation-C-online">&ndash;</span> / <span class="total" id="nation-C-total">&ndash;</span></td>
              </tr>
            </tbody>
          </table>
          <div class="nation-legend">online / total players</div>
        </div>

        <div id="header">
          <a href="https://github.com/AdrianCassar/xenia-canary" target="_blank">Github</a>
          -
          <a href="https://github.com/AdrianCassar/xenia-canary/releases" target="_blank">Releases</a>
          -
          <a href="https://github.com/AdrianCassar/xenia-canary/wiki" target="_blank">Netplay Wiki</a>
        </div>

        <button id="server_details_btn">Server Details</button>

        <div id="server_details">
          <ul style="list-style-type:none;">
            <li>Commit: <a id="BUILD_COMMIT" href="https://github.com/AdrianCassar/xenia-canary" target="_blank"></a></li>
            <li>Released At: <label id="RELEASE_CREATED_AT"></label></li>
            <li>Uptime: <label id="UPTIME"></label></li>
          </ul>  
        </div>

        <div id="sessions">
            <table>
                <tr>
                    <th>Gaming Sessions</th>
                    <th>Players</th>
                    <th id="title_update">Latest TU</th>
                </tr>
                <tr>
                  <td>
                    <div class="skeleton-container">
                      <div class="post">
                        <div class="avatar">
                          <img alt="xbox-icon" src="assets/xbox.svg"/>
                        </div>
                        <div class="line"></div>
                        <div class="line"></div>
                      </div>
                    </div>
                  </td>
                  <td>
                    <div class="skeleton-container">
                      <div class="post">
                        <div class="avatar">
                          <img alt="xbox-icon" src="assets/xbox.svg"/>
                        </div>
                        <div class="line"></div>
                        <div class="line"></div>
                      </div>
                    </div>
                  </td>
                </tr>
            </table>
        </div>

        <div id="countdown"></div>
      </div>
    </body>
</html>
